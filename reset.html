<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E4U Reset Cache</title>
  <style>body{font-family:Arial,sans-serif;background:#eef8f1;display:grid;place-items:center;min-height:100vh;color:#10291d}.card{background:white;border:1px solid #cfe4d6;border-radius:18px;padding:28px;max-width:560px;box-shadow:0 12px 30px #0001}.btn{display:inline-block;background:#0f7a45;color:white;text-decoration:none;border-radius:12px;padding:14px 18px;font-weight:700;margin-top:10px}.muted{color:#5c6b7d}</style>
</head>
<body>
  <div class="card">
    <h1>E4U Cache Reset</h1>
    <p id="status">Resetting browser cache and old service worker...</p>
    <p class="muted">After reset, open the app using the button below.</p>
    <a class="btn" href="./?fresh=267">Open E4U HR Payroll</a>
  </div>
  <script>
    (async function(){
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        localStorage.removeItem('supabase.auth.token');
        document.getElementById('status').textContent = 'Reset complete. You may now open the app.';
      } catch (e) {
        document.getElementById('status').textContent = 'Reset attempted. Please open the app.';
      }
    })();
  </script>
</body>
</html>
